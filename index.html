<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>软体实时模拟 · WebGPU</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #14171c;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        #app {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #unsupported {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 24px;
            color: #e6e8ec;
            text-align: center;
        }

        #unsupported h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }

        #unsupported p {
            margin: 0;
            max-width: 34em;
            line-height: 1.7;
            color: #9aa2ad;
            font-size: 14px;
        }

        #unsupported code {
            color: #d0d5dc;
            background: #22262d;
            padding: 1px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <canvas id="app"></canvas>
    <div id="unsupported">
        <h1>应用启动失败</h1>
        <p></p>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
